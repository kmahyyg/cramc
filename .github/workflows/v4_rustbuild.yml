name: Binary Build (Yara-X)

on:
  push:
    branches:
      - 'v4_yarax'
      - 'v4_2_grpc'
    tags:
      - 'v0.5.*'
      - 'v0.6.*'
  pull_request:
    branches:
      - 'v4_yarax'
      - 'v4_2_grpc'
    types:
      - ready_for_review
      - opened

permissions:
  contents: write

env:
  GO_VER: "1.24.4"
  YARAX_VER: "1.3.0"
  PROJECT_DEST: "/opt/buildtargets"
  PROJECT_NAME: "cramc_go"
  THIRD_PARTY_SRC: "/opt/softsrcs"

jobs:
  build-linux-amd64:
    if: ${{ !startsWith(github.event.head_commit.message ,'[w/o ci]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout CRAMC source code
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true
          fetch-tags: true
          fetch-depth: 0
          path: 'cramc'
      - name: Checkout YARA-X source code
        uses: actions/checkout@v4
        with:
          repository: 'VirusTotal/yara-x'
          ref: 'v1.3.0'
          path: 'yara-x'
      - name: Setup Golang Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.4'
          cache-dependency-path: 'cramc/gocode/go.sum'
      - name: Setup Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 'stable'   # this should be updated AT THE SAME TIME when bumping version of YARA-X
          default: true
      - name: Caching with Cargo Dependencies And Yara-X build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ github.workspace }}/yara-x/target
            ${{ env.PROJECT_DEST }}/${{ env.PROJECT_NAME }}/linux_amd64
          key: ${{ runner.os }}-cargo-rust-linuxbuild
      - name: Install cargo-c from crates.io with cache
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-c
          locked: false
          cache-key: ${{ runner.os }}-cargo-cinstall-linuxbuild
      - name: Run Build Script
        run: |
          cd ${GITHUB_WORKSPACE}/cramc
          ./assets/build.sh linux amd64
          sha256sum ./bin/*
          tree ./bin
      - name: Upload Runtime Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: database_updates
          retention-days: 30
          path: ${{ github.workspace }}/cramc/bin/*.bin
      - name: Upload DevReleaser Artifact
        uses: actions/upload-artifact@v4
        with:
          name: devreleaser
          retention-days: 30
          path: ${{ github.workspace }}/cramc/bin/devreleaser_linux_amd64

  build-windows-amd64:
    runs-on: ubuntu-24.04
    needs:
      - build-linux-amd64
    steps:
      - name: Checkout CRAMC source code
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true
          fetch-tags: true
          fetch-depth: 0
          path: 'cramc'
      - name: Checkout YARA-X source code
        uses: actions/checkout@v4
        with:
          repository: 'VirusTotal/yara-x'
          ref: 'v1.3.0'
          path: 'yara-x'
      - name: Setup Golang Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.4'
          cache-dependency-path: 'cramc/gocode/go.sum'
      - name: Setup Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 'stable'   # this should be updated AT THE SAME TIME when bumping version of YARA-X
          default: true
          target: 'x86_64-pc-windows-gnu'
      - name: Caching with Cargo Dependencies And Yara-X Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ github.workspace }}/yara-x/target
            ${{ env.PROJECT_DEST }}/${{ env.PROJECT_NAME }}/win_amd64
          key: ${{ runner.os }}-cargo-rust-winbuild
      - name: Install cargo-c from crates.io with cache
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-c
          locked: false
          cache-key: ${{ runner.os }}-cargo-cinstall-winbuild
      - name: Run Build Script
        run: |
          cd ${GITHUB_WORKSPACE}/cramc
          ./assets/build.sh windows amd64
          cp -ar ./assets/dist/*.ps1 ./bin/
          tree ./bin
      - name: Download artifacts previously generated
        uses: actions/download-artifact@v4
        with:
          path: ${{ github.workspace }}/cramc/bin
          merge-multiple: true
      - name: Build Convenient Package for End Users
        run: |
          cd ${GITHUB_WORKSPACE}/cramc/bin
          tree .
          sha256sum ./*
          zip -r cramc_go_${GITHUB_RUN_ID}.zip privhelper.exe cramc_aio.exe cramc_db.bin unified.yar.bin *.ps1
      - name: Upload All Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cramc_go
          retention-days: 30
          if-no-files-found: error
          path: ${{ github.workspace }}/cramc/bin/cramc_go_${{ github.run_id }}.zip

  release-to-public:
    needs:
      - build-windows-amd64
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare for release
        run: |
          sudo apt update -y
          sudo apt install tree -y
          mkdir -p /tmp/relbuild/${{ github.repository_owner }}
      - name: Download artifacts previously generated
        uses: actions/download-artifact@v4
        with:
          path: /tmp/relbuild/${{ github.repository_owner }}
          merge-multiple: true
      - name: List all artifacts downloaded
        run: |
          cd /tmp/relbuild/${{ github.repository_owner }}
          tree .
          sha256sum ./* > SHA256SUM
      - name: Craft release
        uses: ncipollo/release-action@v1
        with:
          artifactErrorsFailBuild: true
          body: |
            We recommend everyone stays on the latest version. 
            To use, download `*.zip` and extract to a new empty folder and execute `cramc_aio.exe` under that folder. 
            Program will try auto-elevate based on your current privileges. 
            This version uses totally different scanner engine, please do not reuse rules from v0.4.x.
            **For CrowdStrike User, please whitelist `privhelper.exe` if you plan to spawn it using SYSTEM context.**
            PrivHelper logging and lock files are saved to: `%UserProfile%\.cramc\`
          allowUpdates: true
          prerelease: true
          artifacts: /tmp/relbuild/${{ github.repository_owner }}/*