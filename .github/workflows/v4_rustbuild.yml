name: Binary Build (Yara-X)

on:
  push:
    branches:
      - 'v4_yarax'
      - 'v4_2_grpc'
      - 'v5_overhaul'
      - 'v5_2_rewrite2'
    tags:
      - 'v0.5.*'
      - 'v0.6.*'
  pull_request:
    branches:
      - 'v4_yarax'
      - 'v4_2_grpc'
      - 'v5_overhaul'
      - 'v5_2_rewrite2'
    types:
      - ready_for_review
      - opened

permissions:
  contents: write

env:
  GO_VER: '1.26.1'
  YARAX_VER: 'v1.14.0'   # when upgrading, don't forget to upgrade go module dependency in go.mod
  PROJECT_DEST: "/opt/buildtargets"
  PROJECT_NAME: "cramc_go"
  THIRD_PARTY_SRC: "/opt/softsrcs"

jobs:
  build-linux-amd64:
    if: ${{ !startsWith(github.event.head_commit.message ,'[w/o ci]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout CRAMC source code
        uses: actions/checkout@v6
        with:
          submodules: true
          lfs: true
          fetch-tags: true
          fetch-depth: 0
          path: 'cramc'
      - name: Checkout YARA-X source code
        uses: actions/checkout@v6
        with:
          repository: 'VirusTotal/yara-x'
          ref: ${{ env.YARAX_VER }}
          path: 'yara-x'
      - name: Setup Golang Toolchain
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VER }}
          cache-dependency-path: 'cramc/go.work.sum'
      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 'stable'   # this should be updated AT THE SAME TIME when bumping version of YARA-X
          cache: false
      - name: Caching with Cargo Dependencies And Yara-X build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/bin/
            ${{ github.workspace }}/yara-x/target
            ${{ env.PROJECT_DEST }}/${{ env.PROJECT_NAME }}/linux_amd64
          key: ${{ runner.os }}-cargo-rust-linuxbuild
      - name: Install cargo-c from crates.io with cache
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-c
          locked: false
          cache-key: ${{ runner.os }}-cargo-cinstall-linuxbuild
      - name: Run Build Script
        run: |
          cd ${GITHUB_WORKSPACE}/cramc
          ./assets/build.sh linux amd64
          sha256sum ./bin/*
          tree ./bin
      - name: Upload Runtime Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: database_updates
          retention-days: 15
          path: ${{ github.workspace }}/cramc/bin/*.bin
      - name: Upload DevReleaser Artifact
        uses: actions/upload-artifact@v7
        with:
          name: devreleaser
          retention-days: 15
          path: ${{ github.workspace }}/cramc/bin/devreleaser_linux_amd64

  build-windows-amd64:
    runs-on: ubuntu-24.04
    needs:
      - build-linux-amd64
    steps:
      - name: Checkout CRAMC source code
        uses: actions/checkout@v6
        with:
          submodules: true
          lfs: true
          fetch-tags: true
          fetch-depth: 0
          path: 'cramc'
      - name: Checkout YARA-X source code
        uses: actions/checkout@v6
        with:
          repository: 'VirusTotal/yara-x'
          ref: ${{ env.YARAX_VER }}
          path: 'yara-x'
      - name: Setup Golang Toolchain
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VER }}
          cache-dependency-path: 'cramc/go.work.sum'
      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 'stable'   # this should be updated AT THE SAME TIME when bumping version of YARA-X
          target: 'x86_64-pc-windows-gnu'
          cache: false
      - name: Caching with Cargo Dependencies And Yara-X Build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/bin/
            ${{ github.workspace }}/yara-x/target
            ${{ env.PROJECT_DEST }}/${{ env.PROJECT_NAME }}/win_amd64
          key: ${{ runner.os }}-cargo-rust-winbuild
      - name: Install cargo-c from crates.io with cache
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-c
          locked: false
          cache-key: ${{ runner.os }}-cargo-cinstall-winbuild
      - name: Run Build Script
        run: |
          cd ${GITHUB_WORKSPACE}/cramc
          ./assets/build.sh windows amd64
          cp -ar ./assets/dist/*.ps1 ./bin/
          tree ./bin
      - name: Download artifacts previously generated
        uses: actions/download-artifact@v8
        with:
          path: ${{ github.workspace }}/cramc/bin
          merge-multiple: true
      - name: Build Convenient Package for End Users
        run: |
          cd ${GITHUB_WORKSPACE}/cramc/bin
          tree .
          sha256sum ./*
          zip -r cramc_go_${GITHUB_RUN_ID}.zip cramc_aio.exe *.bin *.ps1
      - name: Upload necessary artifact 1 - cramc_aio
        uses: actions/upload-artifact@v7
        with:
          name: cramc_go
          retention-days: 15
          if-no-files-found: error
          path: ${{ github.workspace }}/cramc/bin/cramc_go_${{ github.run_id }}.zip
      - name: Upload optional artifact 2 - bakrestorer
        uses: actions/upload-artifact@v7
        with:
          name: bakrestorer
          retention-days: 15
          if-no-files-found: error
          path: ${{ github.workspace }}/cramc/bin/bakrestorer.exe

  release-to-public:
    needs:
      - build-windows-amd64
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare for release
        run: |
          sudo apt update -y
          sudo apt install tree -y
          mkdir -p /tmp/relbuild/${{ github.repository_owner }}
      - name: Download artifacts previously generated
        uses: actions/download-artifact@v8
        with:
          path: /tmp/relbuild/${{ github.repository_owner }}
          merge-multiple: true
      - name: List all artifacts downloaded
        run: |
          cd /tmp/relbuild/${{ github.repository_owner }}
          tree .
          sha256sum ./* > SHA256SUM
      - name: Craft release
        uses: ncipollo/release-action@v1
        with:
          artifactErrorsFailBuild: true
          body: |
            We recommend everyone stays on the latest version. 
            **PLEASE READ README FILE IN REPOSITORY BEFORE CONTINUE!**
            - To use, download `*.zip` and extract to a new empty folder and execute `1drv_desync_cleanup_stale.ps1` then `cramc_aio.exe` under that folder. 
            This version uses totally different scanner engine, please do not reuse rules from v0.4.x.
            BakRestorer is built for restoring original file from encrypted zstd compression file.
            **Crowdstrike users are NOT SUPPORTED.**
            **For files saved under shared storage (e.g. SharePoint), proceed with caution.**
            Since v0.6.0, Office installation is no longer required for the tool to work.
          allowUpdates: true
          prerelease: true
          artifacts: /tmp/relbuild/${{ github.repository_owner }}/*